<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO básico -->
  <meta name="description" content="MOD Creaciones: velas de soja, stickers, papelería creativa y agendas. Comprá online o contactanos por WhatsApp e Instagram." />

  <title>MOD Creaciones | Velas de soja, stickers y papelería</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Font Awesome (icons footer) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Tu CSS (compilado desde SCSS) -->
  <link rel="stylesheet" href="css/estilos.css" />
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="site-header">
    <nav class="navbar navbar-light navcolor-custom">
      <div class="container d-flex align-items-center justify-content-between">

        <!-- Botón menú (Offcanvas) -->
        <button class="navbar-toggler" type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#menuMOD"
          aria-controls="menuMOD"
          aria-label="Abrir menú">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
          <span class="menu-label nav-text-thin">Menú</span>
        </button>

        <!-- Logo / Marca -->
        <a class="navbar-brand mx-auto position-absolute start-50 translate-middle-x"
          href="index.html"
          aria-label="Ir al inicio">
          <img src="img/mod-creaciones-logo.png" alt="Logo MOD" class="brand-logo">
        </a>

        <!-- Accesos rápidos  -->
        <div class="d-flex gap-3">
          <a href="pages/contacto.html" class="nav-icon text-decoration-none" aria-label="Ir a Contacto">
            <i class="bi bi-person fs-4" aria-hidden="true"></i>
          </a>

          <a
            href="https://wa.me/5491130619003?text=Hola!%20Quiero%20armar%20un%20pedido%20en%20MOD%20Creaciones."
            target="_blank"
            rel="noopener noreferrer"
            class="nav-icon text-decoration-none"
            aria-label="Consultar por WhatsApp para armar un pedido">
            <i class="bi bi-cart fs-4" aria-hidden="true"></i>
          </a>
        </div>

        <!-- Offcanvas (menú lateral) -->
        <div class="offcanvas offcanvas-start" tabindex="-1" id="menuMOD" aria-labelledby="menuMODLabel">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title nav-text-thin" id="menuMODLabel">Menú</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
          </div>

          <div class="offcanvas-body">
            <ul class="navbar-nav">
              <li class="nav-item nav-text-thin">
                <a class="nav-link" href="index.html" aria-current="page">Inicio</a>
              </li>
              <li class="nav-item nav-text-thin">
                <a class="nav-link" href="pages/productos.html">Productos</a>
              </li>
              <li class="nav-item nav-text-thin">
                <a class="nav-link" href="pages/contacto.html">Contacto</a>
              </li>
            </ul>
          </div>
        </div>

      </div>
    </nav>
  </header>

  <!-- ================= MAIN ================= -->
  <main>

    <!-- HERO -->
    <section class="page-hero">
      <h1 class="text-bodoni-italic">Bienvenidos a MOD Creaciones</h1>
      <p class="text-thin-italic">La creatividad empieza cuando te animás a intentar.</p>
    </section>

    <!-- CARRUSEL: CATEGORÍAS HOME -->
    <section class="container my-4 categorias-home" aria-label="Categorías destacadas">
      <!-- Título semántico de la sección -->
      <h2 class="visually-hidden">Categorías destacadas</h2>

      <div id="carouselCategorias" class="carousel slide" data-bs-ride="carousel">

        <!-- Indicadores -->
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselCategorias" data-bs-slide-to="0" class="active" aria-label="Ver categoría: Velas"></button>
          <button type="button" data-bs-target="#carouselCategorias" data-bs-slide-to="1" aria-label="Ver categoría: Stickers"></button>
          <button type="button" data-bs-target="#carouselCategorias" data-bs-slide-to="2" aria-label="Ver categoría: Papelería"></button>
        </div>

        <div class="carousel-inner">

          <!-- SLIDE 1 -->
          <div class="carousel-item active">
            <a href="pages/productos.html" class="text-decoration-none" aria-label="Ver productos: Velas de soja">
              <article class="card shadow-sm">
                <img
                  src="img/inicio-velas.jpeg"
                  class="card-img-top categoria-card__img"
                  alt="Velas de soja artesanales en distintos recipientes"
                  loading="lazy"
                  decoding="async"
                >
              </article>
            </a>
          </div>

          <!-- SLIDE 2 -->
          <div class="carousel-item">
            <a href="pages/productos.html" class="text-decoration-none" aria-label="Ver productos: Stickers">
              <article class="card shadow-sm">
                <img
                  src="img/inicio-stickers.jpeg"
                  class="card-img-top categoria-card__img"
                  alt="Stickers personalizados con diseños variados"
                  loading="lazy"
                  decoding="async"
                >
              </article>
            </a>
          </div>

          <!-- SLIDE 3 -->
          <div class="carousel-item">
            <a href="pages/productos.html" class="text-decoration-none" aria-label="Ver productos: Papelería">
              <article class="card shadow-sm">
                <img
                  src="img/inicio-papeleria.jpeg"
                  class="card-img-top categoria-card__img"
                  alt="Papelería creativa: cuadernos, agendas y accesorios"
                  loading="lazy"
                  decoding="async"
                >
              </article>
            </a>
          </div>

        </div>

        <!-- Flechas -->
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselCategorias" data-bs-slide="prev" aria-label="Anterior">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#carouselCategorias" data-bs-slide="next" aria-label="Siguiente">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
        </button>

      </div>

    </section>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="text-thin-italic">
    <div class="footer-inner">

      <p>© MOD Creaciones</p>

      <div class="footer-social">
        <div class="social-card">
          <ul>

            <!-- Instagram -->
            <li class="iso-pro">
              <span></span><span></span><span></span>
              <a class="social-link social-ig"
                 href="https://www.instagram.com/creaciones.dai/"
                 target="_blank"
                 rel="noopener noreferrer"
                 aria-label="Instagram">
                <i class="fa-brands fa-instagram social-icon" aria-hidden="true"></i>
              </a>
              <div class="social-text">Instagram</div>
            </li>

            <!-- WhatsApp -->
            <li class="iso-pro">
              <span></span><span></span><span></span>
              <a class="social-link social-wa"
                 href="https://wa.me/5491130619003"
                 target="_blank"
                 rel="noopener noreferrer"
                 aria-label="WhatsApp">
                <i class="fa-brands fa-whatsapp social-icon" aria-hidden="true"></i>
              </a>
              <div class="social-text">WhatsApp</div>
            </li>

            <!-- Mail -->
            <li class="iso-pro">
              <span></span><span></span><span></span>
              <a class="social-link social-mail"
                 href="mailto:modcreaciones.dai@gmail.com"
                 aria-label="Mail">
                <i class="fa-regular fa-envelope social-icon" aria-hidden="true"></i>
              </a>
              <div class="social-text">Mail</div>
            </li>

          </ul>
        </div>
      </div>

    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
